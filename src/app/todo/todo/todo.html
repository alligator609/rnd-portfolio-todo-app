<div class="todo-container mt-12 p-4 max-w-md mx-auto bg-white rounded shadow">
  <h2>Number Of Task: {{ dummyTodos.length }}</h2>

  @if (dummyTodos.length > 0) {
    <ul class="todo-list">
      @for (todo of dummyTodos; track $index) {
        <li
          class="mb-3 p-3 border rounded flex justify-between items-start"
          [class.opacity-60]="todo.completed"
        >
          <div>
            <h3 class="font-semibold text-lg">{{$index +1}} {{ todo.title }}</h3>
            <p class="text-sm text-gray-600">{{ todo.description }}</p>
          </div>
          <div class="flex flex-col items-end ml-4">
            <label class="flex items-center text-sm mb-2">
              <input
                type="checkbox"
                [checked]="todo.completed"
                (change)="toggleComplete(todo.id)"
                class="mr-2"
              />
              Completed
            </label>
            <button (click)="removeTodo(todo.id)" class="text-red-600 text-sm">
              Remove
            </button>
          </div>
        </li>
      }
    </ul>
  } @else {
    <p class="text-sm text-gray-500">No Tasks yet. Add one above.</p>
  }
</div>
